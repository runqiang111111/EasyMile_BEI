[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ezdolly"
version = "0.1.0"
description = "EZDolly : repartition vectorielle du couple (double Ackermann, yaw PI, allocation cos phi)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "openpyxl>=3.1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
